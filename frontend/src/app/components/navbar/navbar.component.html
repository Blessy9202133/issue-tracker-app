<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-brand">
      <img src="hbl_logo.jpg" alt="HBL Logo" class="navbar-logo" />
      <span>Customer Complaint Portal For Kavach</span>
    </a>

    <div class="nav-links">
      @if (authService.isLoggedIn()) {
        @if (!isMainPage()) {
          <a routerLink="/create-issue" class="nav-item">Register Complaint</a>
        }
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>

        <div class="user-info">
          <span class="user-badge">👤 {{ authService.currentUser()?.name || authService.currentUser()?.username }}</span>
          <button type="button" (click)="logout()" class="btn-logout" title="Sign Out">
            Logout
          </button>
        </div>
      } @else {
        @if (!isAuthPage()) {
          <a routerLink="/login" class="nav-item active">Sign In</a>
        }
      }
    </div>
  </div>
</nav>
