<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
        </svg>
      </div>
      <h2>Reset Password</h2>
      <p class="auth-subtitle">Create a new secure password for your account</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-alert alert-error">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="auth-alert alert-success">
        ✓ {{ successMessage() }}
        <p class="redirect-text">Redirecting to login page...</p>
      </div>
    }

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="newPassword">New Password <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Enter new password (min 6 chars)"
            class="form-control"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="toggleNewPasswordVisibility()"
            title="Toggle password visibility"
          >
            {{ showNewPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter new password"
            class="form-control"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="toggleConfirmPasswordVisibility()"
            title="Toggle password visibility"
          >
            {{ showConfirmPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading() || !hash" class="btn-auth-submit">
        {{ loading() ? 'Updating Password...' : 'Reset Password' }}
      </button>

      <div class="auth-footer-links">
        <a routerLink="/login" class="link-back-login">← Back to Login</a>
      </div>
    </form>
  </div>
</div>
