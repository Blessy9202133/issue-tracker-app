<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Forgot Password</h2>
      <p class="auth-subtitle">Enter your details to receive a password reset link</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-alert alert-error">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="auth-alert alert-success">
        ✓ {{ successMessage() }}
      </div>
    }

    @if (resetLink()) {
      <div class="direct-link-box">
        <p><strong>Direct Reset Link:</strong></p>
        <a [href]="resetLink()" target="_blank" class="direct-reset-link">{{ resetLink() }}</a>
      </div>
    }

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username or Email Address <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">✉️</span>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your registered username or email"
            class="form-control"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <button type="submit" [disabled]="loading()" class="btn-auth-submit">
        {{ loading() ? 'Generating Reset Link...' : 'Send Reset Link' }}
      </button>

      <div class="auth-footer-links">
        <a routerLink="/login" class="link-back-login">← Back to Login</a>
      </div>
    </form>
  </div>
</div>
