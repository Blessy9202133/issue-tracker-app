<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Fill in details to register as a Reporter or Assignee</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #regForm="ngForm">
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          placeholder="Full Name"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email Address"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="username">Username (for login) <span class="required">*</span></label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Username"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number <span class="required">*</span></label>
        <input
          type="tel"
          id="phoneNumber"
          name="phoneNumber"
          [(ngModel)]="phoneNumber"
          placeholder="Phone Number"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password (min 6 chars)"
          required
          minlength="6"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="role">User Role</label>
        <select id="role" name="role" [(ngModel)]="role" class="form-control">
          <option value="REPORTER">Reporter (Log & raise issues)</option>
          <option value="ASSIGNEE">Assignee (Respond & resolve issues)</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        {{ loading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Log in here</a></p>
    </div>
  </div>
</div>
