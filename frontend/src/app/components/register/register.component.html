<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h2>Create New Account</h2>
      <p class="auth-subtitle">Register to access Customer Complaint Portal</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-alert alert-error">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="auth-alert alert-success">
        ✓ {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="name"
            placeholder="e.g. Sushma O"
            class="form-control"
            required
          />
        </div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">🏷️</span>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="e.g. sushma_o"
            class="form-control"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="e.g. sushma@hbl.in"
            class="form-control"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Minimum 6 characters"
            class="form-control"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="togglePasswordVisibility()"
            title="Toggle password visibility"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your password"
            class="form-control"
            required
            autocomplete="new-password"
          />
        </div>
      </div>

      <button type="submit" [disabled]="loading()" class="btn-auth-submit">
        {{ loading() ? 'Creating Account...' : 'Create Account' }}
      </button>

      <div class="auth-footer-links">
        <span>Already have an account?</span>
        <a routerLink="/login" class="link-register">Sign In</a>
      </div>
    </form>
  </div>
</div>
