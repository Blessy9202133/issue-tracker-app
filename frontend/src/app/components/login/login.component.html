<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h2>Customer Complaint Portal</h2>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-alert alert-error">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="auth-alert alert-success">
        ✓ {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username or Email <span class="required">*</span></label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username or email"
            class="form-control"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="password">Password <span class="required">*</span></label>
          <a routerLink="/forgot-password" class="link-forgot-password">Forgot Password?</a>
        </div>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            class="form-control"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="togglePasswordVisibility()"
            title="Toggle password visibility"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading()" class="btn-auth-submit">
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>

      <div class="auth-footer-links">
        <span>Don't have an account?</span>
        <a routerLink="/register" class="link-register">Create Account</a>
      </div>
    </form>
  </div>
</div>
