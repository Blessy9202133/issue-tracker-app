<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Customer Complaint Portal</h2>
      <p>Log in with your Username or Email & Password</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="e.g. Sushma or abc@hbl.com"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          class="form-control"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="demo-accounts">
      <p class="demo-title">Quick Demo Logins:</p>
      <div class="demo-buttons">
        <button (click)="fillDemo('Sushma')" class="btn-demo">
          Sushma (Reporter)
        </button>
        <button (click)="fillDemo('jahnavi')" class="btn-demo">
          jahnavi (Assignee)
        </button>
        <button (click)="fillDemo('prabhakar')" class="btn-demo">
          prabhakar (Assignee)
        </button>
      </div>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</div>
